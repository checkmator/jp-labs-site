<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="JP Labs — portfólio empresarial.">
  <title>JP Labs</title>
  <link rel="icon" type="image/svg+xml" href="assets/onda.svg">
  <link rel="preconnect" href="https://terraway.com.br">
  <style>
    :root { color-scheme: light; --blue: #1479ed; --ink: #172337; --muted: #64748b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #fff; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; }
    .card { width: min(100%, 680px); text-align: center; }
    .mark { width: 78px; height: 78px; margin: 0 auto 24px; }
    h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 4.25rem); line-height: 1; letter-spacing: -.065em; font-weight: 700; }
    .label { margin: 16px 0 0; color: var(--muted); font-size: 1rem; letter-spacing: .015em; }
    .rule { width: 44px; height: 2px; margin: 34px auto; background: #dbeafe; }
    .link { display: inline-flex; align-items: center; gap: 9px; padding: 12px 17px; border: 1px solid #dce6f2; border-radius: 999px; color: #176bd0; text-decoration: none; font-size: .95rem; transition: border-color .18s, background .18s; }
    .link:hover, .link:focus-visible { border-color: #94bdf4; background: #f7fbff; }
    .arrow { font-size: 1.1em; }
    footer { position: fixed; inset: auto 0 0; padding: 18px; color: #94a3b8; text-align: center; font-size: .78rem; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="brand">
      <img class="mark" src="assets/onda.svg" alt="" width="78" height="78">
      <h1 id="brand">JP Labs</h1>
      <p class="label">Portfólio empresarial</p>
      <div class="rule" aria-hidden="true"></div>
      <a class="link" href="https://terraway.com.br/" target="_blank" rel="noopener noreferrer">
        terraway.com.br <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </section>
  </main>
  <footer>© <span id="year">2026</span> JP Labs</footer>
</body>
</html>
